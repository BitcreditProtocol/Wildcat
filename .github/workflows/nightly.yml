name: build and push nightly Docker images
run-name: "Nightly images | candidate ${{ inputs.candidate_run_id || 'push' }} | ${{ inputs.expected_sha || github.sha }}"

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact master SHA captured by the candidate
        type: string
        required: true
      candidate_run_id:
        description: Original central candidate run ID
        type: string
        required: true
  pull_request:
    paths:
      - '.github/workflows/nightly.yml'
      - '.github/scripts/test_nightly.py'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.candidate_run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  id-token: write

env:
    PROJECT_ID: "bitcr-shared"
    GAR_LOCATION: "europe-west1"
    REPOSITORY: "bitcr-wildcat-dev"
    GAR_PATH: "europe-west1-docker.pkg.dev/bitcr-shared/bitcr-wildcat-dev"
    BASE_IMAGE_NAME: "wildcat/base-image"
    BASE_IMAGE_CACHE: "europe-west1-docker.pkg.dev/bitcr-shared/bitcr-wildcat-dev/wildcat-base-cache"
    BASE_TAR: "base-image.tar"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/test_nightly.py


# ───────────────────────────────
# detect code changes
# ───────────────────────────────
  changes:
    if: github.event_name != 'pull_request'
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Verify candidate source
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = refs/heads/master || exit 1
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          test "$GITHUB_SHA" = "$EXPECTED_SHA" || exit 1
        fi

    - name: Detect code changes
      id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        base: master
        filters: |
          code:
            - 'crates/**'
            - 'bcr-common/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'recipe.json'
            - 'docker/**/Dockerfile'
            - '.github/workflows/nightly.yml'

# ───────────────────────────────
# build base image, cache, upload local artifact
# ───────────────────────────────
  base-image:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ vars.PRIVATE_REPO_ACCESS_APP_ID }}
        private-key: ${{ secrets.PRIVATE_REPO_ACCESS_APP_PRIVATE_KEY }}
        permission-contents: read
        owner: BitcreditProtocol

    - name: Git auth with app token
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

    - name: Authenticate to GCP
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ secrets.GCLOUD_WIF_PROVIDER }}
        service_account: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}
        token_format: access_token

    - name: Auth w/ registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}


    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.11.0

    - name: Build base image (remote cache + local tar)
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: docker/base-image/Dockerfile
        push: false
        platforms: linux/amd64
        tags: ${{ env.BASE_IMAGE_NAME }}
        build-args: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true
        secrets: |
          "gh_token=${{ steps.app-token.outputs.token }}"
        cache-from: |
          type=registry,ref=${{ env.BASE_IMAGE_CACHE }}:buildcache
        cache-to: |
          type=registry,ref=${{ env.BASE_IMAGE_CACHE }}:buildcache,mode=max
        outputs: |
          type=docker,dest=${{ env.BASE_TAR }},name=${{ env.BASE_IMAGE_NAME }}

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: base-image
        path: "${{ env.BASE_TAR }}"
        retention-days: 1

# ───────────────────────────────
# build & push wildcat images
# ───────────────────────────────
  wildcat-images:
    needs:
      - changes
      - base-image
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    strategy:
      fail-fast: false
      #max-parallel: 1
      matrix:
        service:
          - name: bcr-wdc-core-service
            dockerfile: docker/core-service/Dockerfile
          - name: bcr-wdc-treasury-service
            dockerfile: docker/treasury-service/Dockerfile
          - name: bcr-wdc-quote-service
            dockerfile: docker/quote-service/Dockerfile
          - name: bcr-wdc-wallet-aggregator
            dockerfile: docker/wallet-aggregator/Dockerfile
          - name: bcr-wdc-admin-aggregator
            dockerfile: docker/admin-aggregator/Dockerfile

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Authenticate to GCP
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ secrets.GCLOUD_WIF_PROVIDER }}
        service_account: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}
        token_format: access_token

    - name: Auth w/ GAR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.11.0
      with:
        driver: docker

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: base-image
        path: .

    - name: Load base image
      run: docker load -i "${BASE_TAR}"

    - id: meta
      name: Metadata for ${{ matrix.service.name }}
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ${{ env.GAR_PATH }}/${{ matrix.service.name }}
          ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
        tags: |
          type=raw,value=nightly
          type=raw,value=source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    - id: push
      name: Build & push ${{ matrix.service.name }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ matrix.service.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Record source-specific image digests
      id: resolved
      env:
        IMAGE_NAME: ${{ matrix.service.name }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      run: |
        python3 - <<'PY_IMAGE'
        import json, os, pathlib, re, subprocess
        e = os.environ
        tag = f"source-{e['GITHUB_SHA']}-{e['GITHUB_RUN_ID']}-{e['GITHUB_RUN_ATTEMPT']}"
        references = {}
        for registry, prefix in (("gar", e["GAR_PATH"]), ("ghcr", "ghcr.io/" + e["GITHUB_REPOSITORY_OWNER"].lower())):
            image = prefix + "/" + e["IMAGE_NAME"]
            data = json.loads(subprocess.check_output(["docker", "buildx", "imagetools", "inspect", image + ":" + tag, "--format", "{{json .Manifest}}"], text=True))
            digest = data.get("digest")
            if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                raise SystemExit("Registry returned an invalid image digest")
            references[registry] = image + "@" + digest
            with open(e["GITHUB_OUTPUT"], "a") as output:
                output.write(f"{registry}_digest={digest}\n")
        manifest = dict(schema=1, repository=e["GITHUB_REPOSITORY"], sha=e["GITHUB_SHA"],
                        run_id=e["GITHUB_RUN_ID"], run_attempt=int(e["GITHUB_RUN_ATTEMPT"]),
                        candidate_run_id=e.get("CANDIDATE_RUN_ID", ""), image=e["IMAGE_NAME"],
                        source_tag=tag, references=references)
        pathlib.Path("nightly-image.json").write_text(json.dumps(manifest, sort_keys=True) + "\n")
        PY_IMAGE

    - name: Save the image result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nightly-image-${{ matrix.service.name }}-${{ github.run_attempt }}
        path: nightly-image.json
        if-no-files-found: error
        retention-days: 90

    # ─────────────────────────────
    # provenance
    # ─────────────────────────────
    - name: Attest GAR image
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ env.GAR_PATH }}/${{ matrix.service.name }}
        subject-digest: ${{ steps.resolved.outputs.gar_digest }}
        push-to-registry: true

    - name: Attest GHCR image
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      continue-on-error: true
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
        subject-digest: ${{ steps.resolved.outputs.ghcr_digest }}
        push-to-registry: true
